# =====================================================================
#  MediScan AI - Configuration principale (SANS SECRETS)
#  Les mots de passe sont dans l'application-local.properties (non versionné)
# =====================================================================

spring.application.name=mediscan-ai-backend
# Active le profil "local" => charge automatiquement application-local.properties
spring.profiles.active=local

# ---------- Serveur ----------
server.port=8081

# ---------- MySQL ----------
spring.datasource.url=jdbc:mysql://localhost:3306/mediscan_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
# Valeurs par défaut, remplacées par application-local.properties
spring.datasource.username=root
spring.datasource.password=

# ---------- JPA / Hibernate ----------
# update : Hibernate crée/modifie les tables à partir des entités (pratique en développement)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Bonne pratique : ferme la session JPA à la fin du service, pas de la requête HTTP
spring.jpa.open-in-view=false
# Les scripts SQL sont exécutés à la main, pas par Spring
spring.sql.init.mode=never
# ---------- Upload d'images (étape 13) ----------
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.tomcat.max-swallow-size=10MB
app.upload.dir=uploads

# ---------- JWT (étape 5) ----------
# Le secret est défini dans l'application-local.properties
app.jwt.secret=
# Durée de validité du token : 24 h (en millisecondes)
app.jwt.expiration-ms=86400000

# ---------- CORS (étape 6) ----------
app.cors.allowed-origins=http://localhost:4200,http://192.168.3.143:4200

# ---------- OCR Tesseract (étape 14) ----------
# Dossier contenant fra.traineddata et eng.traineddata
# Windows :      C:/Program Files/Tesseract-OCR/tessdata
# macOS (brew) : /opt/homebrew/share/tessdata
# Ubuntu :       /usr/share/tesseract-ocr/5/tessdata
app.ocr.tessdata-path=C:/Program Files/Tesseract-OCR/tessdata
app.ocr.language=fra+eng

# ---------- Firebase Cloud Messaging (étape 17) ----------
# Mettre à true dans l'application-local.properties une fois le compte de service en place
app.firebase.enabled=false
# Fichier JSON du compte de service : HORS du code source (dossier secrets/, ignoré par Git)
app.firebase.credentials-path=file:C:/Users/user/Desktop/les projets/medicascan/mediscan-ai/dev/mediscan-ai/secrets/firebase-service-account.json
# Adresse de l'application Angular (liens des notifications ; HTTPS obligatoire pour Firebase)
app.frontend.url=http://localhost:4200
# Envoi des rappels de prise chaque minute
app.rappels.planificateur.enabled=true

# ---------- Logs ----------
logging.level.com.mediscan=DEBUG
logging.level.org.springframework.security=INFO