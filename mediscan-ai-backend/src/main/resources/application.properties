# =====================================================================
#  MediScan AI - Configuration principale (SANS SECRETS)
#  Les mots de passe sont dans l'application-local.properties (non versionné)
# =====================================================================

spring.application.name=mediscan-ai-backend
# Active le profil "local" => charge automatiquement application-local.properties
spring.profiles.active=local

# ---------- Serveur ----------
server.port=8081

# ---------- MySQL ----------
spring.datasource.url=jdbc:mysql://localhost:3306/mediscan_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
# Valeurs par défaut, remplacées par application-local.properties
spring.datasource.username=root
spring.datasource.password=

# ---------- JPA / Hibernate ----------
# update : Hibernate crée/modifie les tables à partir des entités (pratique en développement)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Bonne pratique : ferme la session JPA à la fin du service, pas de la requête HTTP
spring.jpa.open-in-view=false
# Les scripts SQL sont exécutés à la main, pas par Spring
spring.sql.init.mode=never
# ---------- Upload d'images (étape 13) ----------
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.upload.dir=uploads

# ---------- JWT (étape 5) ----------
# Le secret est défini dans l'application-local.properties
app.jwt.secret=
# Durée de validité du token : 24 h (en millisecondes)
app.jwt.expiration-ms=86400000

# ---------- CORS (étape 6) ----------
app.cors.allowed-origins=http://localhost:4200

# ---------- OCR Tesseract (étape 14) ----------
app.ocr.tessdata-path=C:/Program Files/Tesseract-OCR/tessdata
app.ocr.language=fra+eng

# ---------- Firebase Cloud Messaging (étape 17) ----------
# Désactivé tant que la clé Firebase n'est pas configurée
app.firebase.enabled=false
app.firebase.credentials-path=classpath:firebase/firebase-service-account.json

# ---------- Logs ----------
logging.level.com.mediscan=DEBUG
logging.level.org.springframework.security=INFO